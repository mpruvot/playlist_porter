[project]
name = "playlist-porter"
version = "0.1.0"
description = "Modern playlist transfer service"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.25.0",
    "yarl>=1.9.0",
    # Web client dependencies
    "jinja2>=3.1.0",
    "python-multipart>=0.0.6",
    # "redis>=5.0.0",
    "ruff>=0.12.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "mypy>=1.16.1",
    "poethepoet>=0.35.0",
]

test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.25.0",
    "respx>=0.21.0",
]

[tool.poe.tasks]
# Linting & Formatting
format = "ruff format src/"
lint = "ruff check --fix src/"
check = "ruff check src/"

# Type checking
type-check = "mypy src"
type-check-strict = "mypy src --strict"

# Development
dev = "python run_dev.py"
dev-reload = "uvicorn src.main:app --reload --host 0.0.0.0 --port 8000"

# Production
run = "uvicorn src.main:app --host 0.0.0.0 --port 8000"

# CI pipeline
ci = ["check", "type-check"]
quality = ["format", "lint", "type-check"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function calls in argument defaults
    "B904",  # raise ... from err (can be ignored for now)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--disable-warnings",
    "--tb=short"
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "spotify: Tests that require Spotify API",
]
asyncio_mode = "auto"
